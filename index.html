    <script>
      // Suppress benign Vite WebSocket connection errors in preview iframe environment
      (function() {
        const _origError = console.error;
        console.error = function(...args) {
          if (args.length > 0 && typeof args[0] === 'string' && (args[0].includes('WebSocket closed without opened') || args[0].includes('[vite] connect failed'))) {
            return;
          }
          _origError.apply(console, args);
        };
        window.addEventListener('error', function(e) {
          if (e.message && e.message.includes('WebSocket closed without opened')) {
            e.preventDefault();
          }
        });
        window.addEventListener('unhandledrejection', function(e) {
          if (e.reason && String(e.reason).includes('WebSocket closed without opened')) {
            e.preventDefault();
          }
        });
      })();
    </script>
